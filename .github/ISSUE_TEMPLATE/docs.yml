name: Documentation
description: Something in the docs is wrong, unclear, out of date or missing.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the document and section.
      placeholder: docs/contract-state-machine.md#transitions
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's the problem?
      options:
        - Doesn't match the code
        - Unclear or hard to follow
        - Out of date
        - Missing information
        - Overclaims (impact, partnerships, or what the ledger proves)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and what should it say? If it doesn't match the code, link the file and line you checked.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data (names, phone numbers, exact locations, photos of people).
          required: true
