name: Proposal
description: Suggest a change to the product, roadmap or architecture.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WaterUptime is problem-first. Proposals should start from a user need, not a technology. Features on the [v0 exclusion list](https://github.com/WaterUptime/WaterUptime/blob/main/docs/product-requirements.md#explicit-exclusions-for-v0) (payments, tokens, AI, mainnet) need a strong case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and how do you know? Link research findings if any.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: affects
    attributes:
      label: Which parts would change?
      options:
        - label: Smart contract (state machine, roles, storage, events)
        - label: Frontend
        - label: Data stored on-chain or off-chain
        - label: Docs or roadmap only
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security and trust impact
      description: Does this put new data on-chain, change who can do what, or change what the ledger appears to prove?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "don't do it" or "use a conventional database".
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data.
          required: true
